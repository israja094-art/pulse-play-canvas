name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Install web dependencies
        run: bun install

      - name: Install Capacitor + plugins
        run: bun add -d @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 @capacitor/filesystem@^6 @capacitor/app@^6

      - name: Build web (SPA) → www/
        run: bunx vite build --config vite.mobile.config.ts

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      - name: Capacitor sync
        run: bunx cap sync android

      - name: Patch AndroidManifest with media permissions
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Insert permissions just after the opening <manifest> tag (only if missing)
          if ! grep -q "READ_MEDIA_VIDEO" "$MANIFEST"; then
            sed -i 's|<manifest |<manifest |; /<manifest /a\    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' "$MANIFEST"
          fi
          cat "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZabPlay-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
